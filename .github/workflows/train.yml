name: Train models

# Daily retrain from the S3 lake. Training runs here rather than in Lambda because
# pandas + pyarrow + scikit-learn exceed Lambda's 250 MB zip limit (and container
# images are out of scope for now). GitHub-hosted runners are free for public repos.
# Requires repository variables: AWS_TRAIN_ROLE_ARN, DATA_URI (s3://<bucket>), AWS_REGION.

on:
  schedule:
    - cron: "17 6 * * *" # 06:17 UTC daily
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  train:
    if: vars.AWS_TRAIN_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TRAIN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}
      - name: Train + evaluate + publish versioned artifacts to s3://.../models/
        run: python -m ml.train --store "${{ vars.DATA_URI }}" | tee train.log
      - name: Job summary
        run: |
          echo '### Training run' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat train.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
